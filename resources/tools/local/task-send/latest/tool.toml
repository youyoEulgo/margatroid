schema_version = 1
name = "task_send"
description = "Queue any JSON value, including null, for a running task (Agent tool or Workspace Lua execution). task_id is a local task id or {agent: target Agent/execution address, task_id: task id} in the same Workspace. The target Lua interprets the value; successful delivery means queued, not processed. For bash, send {text: string, enter?: boolean}."
