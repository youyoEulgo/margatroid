schema_version = 1
name = "read-file"
description = "Read a UTF-8 text file with one-based line numbers. Relative paths resolve from the project root. Files are limited to 16 MiB; the selected numbered lines are limited to 256 KiB. Use offset and limit to select a window. CRLF line endings are displayed without CR. Empty files and offsets beyond the final line return an end-of-file message."
