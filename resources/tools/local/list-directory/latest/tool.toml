# Lua Tool metadata schema version. Margatroid currently accepts version 1.
schema_version = 1

# This name must exactly match the name segment in
# tool:local/list-directory:latest.
name = "list-directory"

# This description is exposed to the model as part of the ToolSpec. It states
# the result shape and makes clear that the operation is not recursive.
description = "List the immediate entries of a directory using an absolute path or a path relative to the current project root. Returns a JSON array sorted by name; each entry contains name, path, and kind. This operation does not recurse into child directories."
