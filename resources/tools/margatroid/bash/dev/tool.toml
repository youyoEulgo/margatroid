schema_version = 1
name = "bash"
description = "Open a persistent interactive Bash PTY with no arguments. task_return returns task_id while the terminal task keeps running. Send {text: string, enter?: boolean} with task_send; enter=true appends a carriage return. Run commands with their normal terminal output, then use task_read on this task_id to retrieve ongoing output from the retained terminal cache. Do not routinely append pipelines such as '2>&1 | tail -40', redirect output to a log file, or create files solely to poll command output: these discard useful diagnostics or duplicate the existing task cache. Use output filtering or durable log files only when the user's task specifically calls for them. Read cached screen updates with task_read: append output normally, or discard the previous display when replaced=true. Reading advances the shared cache cursor; the cache is a bounded terminal display, not an unlimited archival log. Shell exit finishes the task; task_finish stops it and cleans up processes."
