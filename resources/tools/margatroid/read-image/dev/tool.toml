schema_version = 1
name = "read-image"
description = "Read an image into your visual context so you can inspect and analyze its contents. After reading, explain the relevant findings to the user. This tool does not present or send the image to the user. Supports source PNG, JPEG, GIF and WebP. Source files are decoded before preview compression, with no fixed 5 MiB input cutoff. Sends an aspect-preserving compressed preview, default longest side 1280 pixels, JPEG quality 80/70/60 or alpha-preserving WebP, with a 300 KiB target. Small images are not enlarged and original files are untouched. Raise max_dimension, quality or target_bytes when fine detail is needed; animation uses its first frame. Paths may be absolute or relative to the project root. Format is identified by file signature rather than extension. Unsupported, empty, unreadable or corrupt files fail explicitly."
