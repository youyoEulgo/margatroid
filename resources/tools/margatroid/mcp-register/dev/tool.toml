schema_version = 1
name = "mcp-register"
description = "Connect an MCP server over stdio or HTTP and register its discovered tools plus a <alias_prefix>update tool for this agent. Returns the owner task_id and tool aliases; keep the owner task running while calling those tools. Use the generated update tool with complete new server parameters to replace this MCP connection and its saved startup command in one call. Requires the separately built bin/mcp-client in this resource. Optional alias_prefix defaults to mcp_; invalid bytes in remote names become underscores and alias collisions fail atomically. Successful registration saves its replay command in this Agent initialization.custom for later starts; identical saved commands are not appended again. If saving fails, the result explicitly reports that tools are registered only for this session."
