sandbox = ["read_only"]

[compaction]
threshold = 0.8
keep_messages = 16

[inference]
model = "openrouter/deepseek-v4.1-flash"
temperature = 0.1
top_p = 0.9

[initialization]
# Run defaults first, then user-defined commands.
default = [
    { command = "IMPORT TOOL tool:local/skill-register:latest AS skill_register", arguments = [] },
    { command = "IMPORT TOOL tool:local/mcp-register:latest AS mcp_register", arguments = [] },
    { command = "IMPORT MESSAGE prompt:local/reviewer-soul:latest AS soul", arguments = [] },
    { command = "IMPORT MESSAGE prompt:local/compact:latest AS compact", arguments = [] },
    { command = "IMPORT TOOL tool:local/list-directory:latest AS list_dir", arguments = [] },
    { command = "IMPORT TOOL tool:local/read-file:latest AS read_file", arguments = [] },
    { command = "IMPORT TOOL tool:local/read-image:latest AS read_image", arguments = [] },
    { command = "IMPORT TOOL tool:local/grep:latest AS grep", arguments = [] },
    { command = "IMPORT TOOL tool:local/glob:latest AS glob", arguments = [] },
    { command = "IMPORT TOOL tool:local/task-read:latest AS task_read", arguments = [] },
    { command = "IMPORT TOOL tool:local/task-send:latest AS task_send", arguments = [] },
    { command = "IMPORT TOOL tool:local/task-finish:latest AS task_finish", arguments = [] },
    { command = "IMPORT SANDBOX sandbox:local/workspace-write:latest AS workspace_write", arguments = [] },
    { command = "IMPORT SANDBOX sandbox:local/read-only:latest AS read_only", arguments = [] },
    { command = "CREATE TEMP BLOCK msg (instructions, compact_prompt, compact_context)", arguments = [] },
    { command = "CREATE TEMP BLOCK entry (pending)", arguments = [] },
    { command = "CREATE BLOCK session (conversation)", arguments = [] },
    { command = "INJECT soul TO msg.instructions", arguments = [] },
    { command = "INJECT compact TO msg.compact_prompt", arguments = [] },
]
custom = []
