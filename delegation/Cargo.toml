[package]
name = "delegation"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["sync", "macros", "rt"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
types = { path = "../types" }
