[package]
name = "providers"
version = "0.1.0"
edition = "2024"

[dependencies]
types = { path = "../types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.2", features = ["json", "stream"] }
futures = "0.3"
async-stream = "0.3"
tokio = { version = "1", features = ["full"] }