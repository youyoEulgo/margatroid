[package]
name = "sandbox"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "6.0.0"
toml = "1.1.2+spec-1.1.0"
tokio = { version = "1", features = ["full", "macros", "rt-multi-thread"] }
tracing = "0.1"
tempfile = "3.27.0"
paths = { path = "../paths" }
