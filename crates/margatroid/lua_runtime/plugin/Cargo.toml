[package]
name = "lua_runtime_plugin"
version = "0.1.0"
edition = "2024"

[dependencies]
lua_runtime_core = { path = "../core" }
workspace_core = { path = "../../workspace/core" }
mcl_core = { path = "../../mcl/core" }
app_runtime_plugin = { path = "../../../mecs/app_runtime_plugin" }
async_runtime_plugin = { path = "../../../mecs/async_runtime_plugin" }
closure_plugin = { path = "../../../mecs/closure_plugin" }
core_plugin = { path = "../../../mecs/core_plugin" }
futures-util = "0.3"
mlua = { version = "0.11", features = ["lua54", "vendored", "async"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread"] }
