[package]
name = "lua_runtime_core"
version = "0.1.0"
edition = "2024"

[dependencies]
core_plugin = { path = "../../../mecs/core_plugin" }
serde_json = "1"
tokio = { version = "1", features = ["sync", "fs", "io-util", "process", "rt", "macros"] }
mlua = { version = "0.11", features = ["lua54", "vendored", "async", "serialize", "send"] }
base64 = "0.22"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_yaml = { workspace = true }
toml = { workspace = true }
regex = "1"
globset = "0.4"
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "time"] }
