[package]
name = "lua_runtime_core"
version = "0.1.0"
edition = "2024"

[dependencies]
core_plugin = { path = "../../../mecs/core_plugin" }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time"] }
