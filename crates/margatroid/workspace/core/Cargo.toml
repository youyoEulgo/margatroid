[package]
name = "workspace_core"
version = "0.1.0"
edition = "2021"

[dependencies]
core_plugin = { path = "../../../mecs/core_plugin" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
