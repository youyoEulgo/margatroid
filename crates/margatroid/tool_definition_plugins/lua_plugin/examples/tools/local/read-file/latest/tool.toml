# Lua Tool metadata schema version. Margatroid currently accepts version 1.
schema_version = 1

# This name must exactly match the name segment in
# tool:local/read-file:latest.
name = "read-file"

# This description is exposed to the model as part of the ToolSpec. It should
# explain when the tool is useful and the important behavior of its result.
description = "Read a UTF-8 text file from an absolute path or a path relative to the current project root and return its complete contents. Use this when the contents of a local text file are needed."
