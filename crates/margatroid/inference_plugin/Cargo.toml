[package]
name = "inference_plugin"
version = "0.1.0"
edition = "2021"

[dependencies]
resource_id_plugin = { path = "../resource_id_plugin" }
tokio-util = { version = "0.7", features = ["rt"] }
app_runtime_plugin = { path = "../../mecs/app_runtime_plugin" }
async_runtime_plugin = { path = "../../mecs/async_runtime_plugin" }
core_plugin = { path = "../../mecs/core_plugin" }
futures-util = { workspace = true }
jsonschema = { workspace = true }
margatroid_types = { path = "../types" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "stream"] }
serde = { workspace = true }
serde_json = { workspace = true }
server_plugin = { path = "../../mecs/server_plugin" }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
closure_plugin = { path = "../../mecs/closure_plugin" }
tempfile = "3"
memory_plugin = { path = "../memory_plugin" }
