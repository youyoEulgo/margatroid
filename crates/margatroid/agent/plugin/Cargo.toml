[dependencies]
agent_core = { path = "../core" }
workspace_core = { path = "../../workspace/core" }
tool_core = { path = "../../tool/core" }
inference_core = { path = "../../inference/core" }
lua_runtime_core = { path = "../../lua_runtime/core" }
mcl_core = { path = "../../mcl/core" }
storage_core = { path = "../../storage/core" }
agent_driver_core = { path = "../../agent_driver/core" }
tool_resource_core = { path = "../../tool_resource/core" }
prompt_resource_core = { path = "../../prompt_resource/core" }
sandbox_resource_core = { path = "../../sandbox_resource/core" }
address = { path = "../../address" }
core_plugin = { path = "../../../mecs/core_plugin" }
app_runtime_plugin = { path = "../../../mecs/app_runtime_plugin" }
async_runtime_plugin = { path = "../../../mecs/async_runtime_plugin" }
closure_plugin = { path = "../../../mecs/closure_plugin" }
