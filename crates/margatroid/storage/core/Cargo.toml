[package]
name = "storage_core"
version = "0.1.0"
edition = "2021"

[dependencies]
core_plugin = { path = "../../../mecs/core_plugin" }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
tempfile = "3"
