[package]
name = "terminal_input_plugin"
version = "0.1.0"
edition = "2021"

[dependencies]
app_runtime_plugin = { path = "../app_runtime_plugin" }
core_plugin = { path = "../core_plugin" }
crossterm = "0.29"
external_event_plugin = { path = "../external_event_plugin" }
tracing = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.28", features = ["poll"] }

[dev-dependencies]
portable-pty = "0.9"
tempfile = "3"
