[package]
name = "margatroid"
version = "0.1.0"
edition = "2021"
default-run = "margatroid"

[[bin]]
name = "margatroid"
path = "src/main.rs"

[[bin]]
name = "margatroid-install"
path = "src/install.rs"

[dependencies]
serde_json = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
sha2 = "0.10"
flate2 = "1"
tracing = "0.1"
compose = { path = "../../crates/margatroid/compose" }
app_runtime_plugin = { path = "../../crates/mecs/app_runtime_plugin" }
axum_plugin = { path = "../../crates/margatroid/axum_plugin" }
tool_plugin = { path = "../../crates/margatroid/tool/plugin" }
tokio = { workspace = true }

[dev-dependencies]
workspace_core = { path = "../../crates/margatroid/workspace/core" }
toml = { workspace = true }
futures-util = { workspace = true }
tokio-tungstenite = { workspace = true }
agent_driver_core = { path = "../../crates/margatroid/agent_driver/core" }
address = { path = "../../crates/margatroid/address" }
tool_resource_core = { path = "../../crates/margatroid/tool_resource/core" }
prompt_resource_core = { path = "../../crates/margatroid/prompt_resource/core" }
sandbox_resource_core = { path = "../../crates/margatroid/sandbox_resource/core" }
mlua = { workspace = true }

tempfile = "3"
serde_json = { workspace = true }
