[package]
name = "margatroid_daemon"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "margatroid-daemon"
path = "src/main.rs"

[dependencies]
agent_image_loader_plugin = { path = "../../crates/margatroid/agent_image_loader_plugin" }
agent_plugin = { path = "../../crates/margatroid/agent_plugin" }
app_runtime_plugin = { path = "../../crates/mecs/app_runtime_plugin" }
