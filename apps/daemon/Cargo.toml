[package]
name = "margatroid_daemon"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "margatroid-daemon"
path = "src/main.rs"

[dependencies]
agent_driver_loader_plugin = { path = "../../crates/margatroid/agent_driver_loader_plugin" }
agent_plugin = { path = "../../crates/margatroid/agent_plugin" }
app_runtime_plugin = { path = "../../crates/mecs/app_runtime_plugin" }
async_runtime_plugin = { path = "../../crates/mecs/async_runtime_plugin" }
core_plugin = { path = "../../crates/mecs/core_plugin" }
client_plugin = { path = "../../crates/margatroid/client_plugin" }
config_plugin = { path = "../../crates/margatroid/config_plugin" }
dto_plugin = { path = "../../crates/margatroid/dto_plugin" }
inference_plugin = { path = "../../crates/margatroid/inference_plugin" }
log_plugin = { path = "../../crates/mecs/log_plugin" }
lua_runtime_plugin = { path = "../../crates/margatroid/lua_runtime_plugin" }
memory_plugin = { path = "../../crates/margatroid/memory_plugin" }
mcl_plugin = { path = "../../crates/margatroid/mcl_plugin" }
resource_id_plugin = { path = "../../crates/margatroid/resource_id_plugin" }
server_plugin = { path = "../../crates/mecs/server_plugin" }
tool_plugin = { path = "../../crates/margatroid/tool_plugin" }
ui_plugin = { path = "../../crates/margatroid/ui_plugin" }
tracing = { workspace = true }
workspace_plugin = { path = "../../crates/margatroid/workspace_plugin" }

closure_plugin = { path = "../../crates/mecs/closure_plugin" }
tool_resource_plugin = { path = "../../crates/margatroid/tool_resource_plugin" }
prompt_resource_plugin = { path = "../../crates/margatroid/prompt_resource_plugin" }
sandbox_resource_plugin = { path = "../../crates/margatroid/sandbox_resource_plugin" }

[dev-dependencies]
margatroid_types = { path = "../../crates/margatroid/types" }
serde_json = { workspace = true }
tokio = { workspace = true }
tempfile = "3"
