[package]
name = "cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "margatroid"
path = "src/main.rs"

[dependencies]
anyhow = "1"
margatroid_protocol = { path = "../../crates/margatroid/protocol" }
margatroid_compose = { path = "../../crates/margatroid/compose" }
reqwest = "0.13"
tokio = { version = "1", features = ["macros", "rt"] }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = "3"
