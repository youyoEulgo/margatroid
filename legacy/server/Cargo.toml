[package]
name = "server"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "margatroid-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["ws", "macros"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tokio-stream = { version = "0.1", features = ["sync"] }
async-trait = "0.1"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
providers = { path = "../../crates/margatroid/providers" }
types = { path = "../../crates/margatroid/types" }
runtime_v2 = { path = "../runtime_v2" }
compose = { path = "../../crates/margatroid/compose" }
sandbox = { path = "../../crates/margatroid/sandbox" }
bridge = { path = "../bridge" }
mcp_client = { path = "../mcp_client" }
assets = { path = "../../crates/margatroid/assets" }
paths = { path = "../../crates/margatroid/paths" }
