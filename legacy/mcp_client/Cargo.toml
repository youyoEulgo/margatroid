[package]
name = "mcp_client"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
rmcp = { version = "1.5.0", features = ["client", "transport-child-process"] }
types = { path = "../../crates/margatroid/types" }
providers = { path = "../../crates/margatroid/providers" }
