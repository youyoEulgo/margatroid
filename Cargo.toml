[workspace]
members = [
    "apps/cli",
    "apps/daemon",
    "crates/mecs/core_plugin",
    "crates/mecs/app_runtime_plugin",
    "crates/mecs/signal_plugin",
    "crates/mecs/terminal_input_plugin",
    "crates/mecs/async_runtime_plugin",
    "crates/mecs/log_plugin",
    "crates/mecs/http_server_plugin",
    "crates/mecs/external_event_plugin",
    "crates/margatroid/config_plugin",
    "crates/margatroid/event_bus_plugin",
    "crates/margatroid/llm_plugin",
    "crates/margatroid/sandbox_plugin",
    "crates/margatroid/server_plugin",
    "crates/margatroid/skill_plugin",
    "crates/margatroid/defaults",
    "crates/margatroid/daemon_lifecycle_plugin",
    "crates/margatroid/protocol",
    "crates/margatroid/types",
    "crates/margatroid/providers",
    "crates/margatroid/compose",
    "crates/margatroid/assets",
    "crates/margatroid/paths",
    "crates/margatroid/sandbox",
]

exclude = ["legacy/*"]

resolver = "3"
[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
