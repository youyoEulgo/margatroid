[workspace]
members = [
    "cli",
    "bridge",
    "compose",
    "server",
    "types",
    "providers",
    "plugins",
    "mcp_client",
    "assets",
    "paths",
    "runtime",
    "sandbox",
]

resolver = "3"
[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
