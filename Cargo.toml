[workspace]
members = [
    "apps/cli",
    "apps/daemon",
    "crates/mecs/core_plugin",
    "crates/mecs/app_runtime_plugin",
    "crates/mecs/closure_plugin",
    "crates/mecs/signal_plugin",
    "crates/mecs/async_runtime_plugin",
    "crates/mecs/log_plugin",
    "crates/mecs/server_plugin",
    "crates/margatroid/address",
    "crates/margatroid/axum_plugin",
    "crates/margatroid/agent_driver/core",
    "crates/margatroid/client/core",
    "crates/margatroid/client/plugin",
    "crates/margatroid/config/core",
    "crates/margatroid/config/plugin",
    "crates/margatroid/agent/core",
    "crates/margatroid/agent/plugin",
    "crates/margatroid/workspace/core",
    "crates/margatroid/workspace/plugin",
    "crates/margatroid/lua_runtime/core",
    "crates/margatroid/lua_runtime/plugin",
    "crates/margatroid/storage/core",
    "crates/margatroid/storage/plugin",
    "crates/margatroid/mcl/core",
    "crates/margatroid/mcl/plugin",
    "crates/margatroid/tool/core",
    "crates/margatroid/tool/plugin",
    "crates/margatroid/inference/core",
    "crates/margatroid/inference/plugin",
    "crates/margatroid/tool_resource/core",
    "crates/margatroid/tool_resource/plugin",
    "crates/margatroid/prompt_resource/core",
    "crates/margatroid/prompt_resource/plugin",
    "crates/margatroid/sandbox_resource/core",
    "crates/margatroid/sandbox_resource/plugin",
    "crates/margatroid/protocol",
    "crates/margatroid/dto/plugin",
    "crates/margatroid/compose",
    "crates/margatroid/ui_plugin",
]
resolver = "3"
[workspace.dependencies]
base64 = "0.22"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-tungstenite = "0.29"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
axum = { version = "0.8", features = ["ws"] }
rust-embed = { version = "8", features = ["include-exclude"] }
futures-util = "0.3"
jsonschema = "0.33"
mlua = { version = "0.11", features = ["lua54", "vendored", "async", "serialize", "send"] }
tokio-stream = { version = "0.1", features = ["sync"] }
rusqlite = "0.31"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting"] }
