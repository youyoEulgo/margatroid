[workspace]
members = [
    "apps/cli",
    "apps/daemon",
    "crates/mecs/core_plugin",
    "crates/mecs/app_runtime_plugin",
    "crates/mecs/closure_plugin",
    "crates/mecs/signal_plugin",
    "crates/mecs/async_runtime_plugin",
    "crates/mecs/log_plugin",
    "crates/mecs/server_plugin",
    "crates/margatroid/types",
    "crates/margatroid/resource_id_plugin",
    "crates/margatroid/lua_runtime_plugin",
    "crates/margatroid/compose",
    "crates/margatroid/protocol",
    "crates/margatroid/config_plugin",
    "crates/margatroid/dto_plugin",
    "crates/margatroid/connection_plugin",
    "crates/margatroid/agent_image_loader_plugin",
    "crates/margatroid/inference_plugin",
    "crates/margatroid/tool_plugin",
    "crates/margatroid/memory_plugin",
    "crates/margatroid/mcl_plugin",
    "crates/margatroid/agent_plugin",
    "crates/margatroid/workspace_plugin",
]

resolver = "3"
[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.29"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
jsonschema = "0.33"
mlua = { version = "0.11", features = ["lua54", "vendored", "async", "serialize", "send"] }
tokio-stream = { version = "0.1", features = ["sync"] }
rusqlite = "0.31"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting"] }
